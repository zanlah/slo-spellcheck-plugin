# Local use: `docker compose up --build -d` (values from .env, see .env.example).
# Coolify does not need this file: it builds the Dockerfile straight from the repository.
services:
  addin:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - "BASE_URL=${BASE_URL:-https://localhost:3000}"
      # false behind Coolify/a reverse proxy (the proxy handles SSL)
      - "USE_HTTPS=${USE_HTTPS:-true}"
